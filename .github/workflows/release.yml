name: Linux packages

# Manual helper only. A complete fork release workflow is still required; see FORK.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release to add them to, such as v0.6.0
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux packages
    if: github.repository == 'YyyL15/Snowhush'
    # An older glibc than ubuntu-latest has, so the app runs on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q libwayland-dev rpm file
      - run: cargo build --locked --release --manifest-path linux/Cargo.toml
      - run: linux/packaging/package.sh linux/target/release/snowhush dist
      - run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
